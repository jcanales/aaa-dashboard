# Deploys duties-dashboard DEV (frontend + backend) directly on the office
# server, at https://dev-usbroker.jdgroup.net — same box as production
# (see deploy-prod.yml), isolated by its own ports/paths/pm2 process/Postgres
# container so a dev deploy can never step on prod:
#
#   env          app dir                      web dir                       backend port  pg port  pm2 name
#   production   /opt/duties-dashboard         /var/www/duties-dashboard     3001          5433     duties-backend
#   dev (here)   /opt/duties-dashboard-dev     /var/www/duties-dashboard-dev 3002          5434     duties-backend-dev
#
# Runs on the same self-hosted runner as prod (see deploy-prod.yml's header
# for why a self-hosted runner is needed at all) — one runner serves both
# workflows, so a dev and a prod deploy queue rather than run in parallel,
# which is fine given this box's limited RAM.
#
# Required GitHub repo Secrets, in addition to prod's:
#   JWT_SECRET_DEV  — separate from prod's JWT_SECRET, so dev tokens never
#                     work against prod or vice versa
#   PG_PASSWORD_DEV — separate from prod's PG_PASSWORD (dev has its own
#                     Postgres container/volume, entirely isolated from prod's)
# Reuses prod's MSSQL_* and ANTHROPIC_API_KEY secrets — both point at the same
# legacy RB Systems SQL Server (read-only) and the same Anthropic account, so
# there's no isolation reason to split them per-environment the way JWT_SECRET
# and PG_PASSWORD are.
#
# nginx vhost + DNS record for dev-usbroker.jdgroup.net are one-time manual
# setup, not something this workflow provisions (same as prod's TLS/domain).

name: Deploy to office server (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: deploy-development
  cancel-in-progress: false

env:
  APP_DIR: /opt/duties-dashboard-dev
  WEB_DIR: /var/www/duties-dashboard-dev
  BACKEND_PORT: 3002
  PG_PORT: 5434
  COMPOSE_PROJECT_NAME: duties-dashboard-dev
  PM2_APP_NAME: duties-backend-dev
  PM2_MAX_MEMORY_RESTART: 250M

jobs:
  deploy:
    runs-on: [self-hosted, duties-dashboard]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Write backend .env
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET_DEV }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD_DEV }}
          MSSQL_HOST: ${{ secrets.MSSQL_HOST }}
          MSSQL_PORT: ${{ secrets.MSSQL_PORT }}
          MSSQL_DATABASE: ${{ secrets.MSSQL_DATABASE }}
          MSSQL_USER: ${{ secrets.MSSQL_USER }}
          MSSQL_PASSWORD: ${{ secrets.MSSQL_PASSWORD }}
          MSSQL_TRUST_SERVER_CERT: ${{ secrets.MSSQL_TRUST_SERVER_CERT }}
          MSSQL_ENCRYPT: ${{ secrets.MSSQL_ENCRYPT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          {
            printf 'PORT=%s\n'                    "${BACKEND_PORT}"
            printf 'JWT_SECRET=%s\n'               "$JWT_SECRET"
            printf 'DATABASE_URL=%s\n'              "postgresql://duties_dashboard:${PG_PASSWORD}@localhost:${PG_PORT}/duties_dashboard"
            printf 'PG_USER=%s\n'                  "duties_dashboard"
            printf 'PG_PASSWORD=%s\n'              "$PG_PASSWORD"
            printf 'PG_DATABASE=%s\n'              "duties_dashboard"
            printf 'PG_PORT=%s\n'                  "${PG_PORT}"
            printf 'MSSQL_HOST=%s\n'               "$MSSQL_HOST"
            printf 'MSSQL_PORT=%s\n'               "${MSSQL_PORT:-1433}"
            printf 'MSSQL_DATABASE=%s\n'           "$MSSQL_DATABASE"
            printf 'MSSQL_USER=%s\n'               "$MSSQL_USER"
            printf 'MSSQL_PASSWORD=%s\n'           "$MSSQL_PASSWORD"
            printf 'MSSQL_TRUST_SERVER_CERT=%s\n'  "${MSSQL_TRUST_SERVER_CERT:-true}"
            printf 'MSSQL_ENCRYPT=%s\n'            "${MSSQL_ENCRYPT:-false}"
            printf 'ANTHROPIC_API_KEY=%s\n'        "$ANTHROPIC_API_KEY"
          } > backend.env

      - name: Sync backend to app directory
        run: |
          mkdir -p "${APP_DIR}/backend"
          rsync -a --delete --filter='P node_modules/' \
            backend/dist backend/prisma backend/package.json backend/package-lock.json \
            backend/docker-compose.yml backend/ecosystem.config.cjs \
            "${APP_DIR}/backend/"
          cp backend.env "${APP_DIR}/backend/.env"

      - name: Sync frontend to web directory
        run: |
          mkdir -p "${WEB_DIR}"
          rsync -a --delete dist/ "${WEB_DIR}/"

      - name: Install prod deps, migrate, and reload
        working-directory: ${{ env.APP_DIR }}/backend
        run: |
          set -euo pipefail
          docker compose up -d
          npm ci --omit=dev
          npx prisma generate
          npx prisma migrate deploy
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save

      - name: Smoke-test /health
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -sf "http://127.0.0.1:${BACKEND_PORT}/health" > /dev/null; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time." >&2
          pm2 logs "${PM2_APP_NAME}" --lines 50 --nostream || true
          exit 1
